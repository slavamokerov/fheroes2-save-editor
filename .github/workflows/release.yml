name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel builds run on the arm64 runner: Qt clang_64 (x86_64) + Rosetta 2,
          # because the macos-13 (Intel) runner image is no longer reliably available.
          - os: macos-latest
            platform: macos
            arch: intel
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt (macOS arm64)
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        run: brew install qt cmake ninja

      - name: Install Qt (macOS Intel)
        if: matrix.platform == 'macos' && matrix.arch == 'intel'
        run: |
          brew install cmake ninja
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install aqtinstall
          /tmp/venv/bin/python -m aqt install-qt mac desktop 6.8.2 clang_64 -O "${{ runner.tool_cache }}/Qt"

      - name: Install Qt (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.2 win64_msvc2022_64 -O "${{ runner.tool_cache }}/Qt"

      - name: Install Qt (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-randr0 libxcb-sync1 libxcb-xkb1 \
            libxcb-glx0 libxcb-shm0 libxcb-xinerama0 libxcb-cursor0 libxkbcommon0 \
            libx11-xcb1 fontconfig libdbus-1-3 libegl1
          python3 -m pip install aqtinstall
          # Qt 6.8+ uses the linux_gcc_64 architecture name; aqt unpacks it into 6.8.2/gcc_64.
          python3 -m aqt install-qt linux desktop 6.8.2 linux_gcc_64 -O "${{ runner.tool_cache }}/Qt"

      - name: Configure (macOS arm64)
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS Intel)
        if: matrix.platform == 'macos' && matrix.arch == 'intel'
        shell: bash
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ runner.tool_cache }}/Qt/6.8.2/clang_64" -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ runner.tool_cache }}/Qt/6.8.2/msvc2022_64" -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ runner.tool_cache }}/Qt/6.8.2/gcc_64" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (macOS arm64)
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/fheroes2-save-editor.app
          # Ad-hoc sign so that the bundle passes Gatekeeper checks locally.
          codesign --force --deep --sign - build/fheroes2-save-editor.app
          hdiutil create -volname "fheroes2 Save Editor" -srcfolder build/fheroes2-save-editor.app -ov -format UDZO \
            "fheroes2-save-editor-macos-${{ matrix.arch }}.dmg"

      - name: Package (macOS Intel)
        if: matrix.platform == 'macos' && matrix.arch == 'intel'
        shell: bash
        run: |
          "${{ runner.tool_cache }}/Qt/6.8.2/clang_64/bin/macdeployqt" build/fheroes2-save-editor.app
          # Ad-hoc sign so that the bundle passes Gatekeeper checks locally.
          codesign --force --deep --sign - build/fheroes2-save-editor.app
          hdiutil create -volname "fheroes2 Save Editor" -srcfolder build/fheroes2-save-editor.app -ov -format UDZO \
            "fheroes2-save-editor-macos-${{ matrix.arch }}.dmg"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          QTDIR="${{ runner.tool_cache }}/Qt/6.8.2/msvc2022_64"
          "$QTDIR/bin/windeployqt.exe" --release build/Release/fheroes2-save-editor.exe
          powershell -Command "Compress-Archive -Path build/Release/* -DestinationPath fheroes2-save-editor-windows-x64.zip"

      - name: Package (Linux AppImage)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e
          # Assemble the AppDir: binary + editor translations (the app looks for
          # files/lang next to the binary) + desktop entry + icon.
          mkdir -p AppDir/usr/bin/files/lang \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          install -m 755 build/fheroes2-save-editor AppDir/usr/bin/
          install -m 644 files/lang/*.po AppDir/usr/bin/files/lang/
          install -m 644 packaging/linux/fheroes2-save-editor.desktop AppDir/usr/share/applications/
          install -m 644 packaging/linux/icon-256.png AppDir/usr/share/icons/hicolor/256x256/apps/fheroes2-save-editor.png

          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -c https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          export QMAKE="${{ runner.tool_cache }}/Qt/6.8.2/gcc_64/bin/qmake"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          # appimagetool derives the file name from the desktop entry Name.
          mv fheroes2_Save_Editor-x86_64.AppImage fheroes2-save-editor-linux-x64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fheroes2-save-editor-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            *.dmg
            *.zip
            *.AppImage
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.dmg
            *.zip
            *.AppImage
          generate_release_notes: true
